# Local conda recipe for the full "pankegg" package (database builder + web app),
# built from this checkout:  conda build conda.recipe
# The version is read from pankegg/__init__.py (single source).
{% set version = load_file_regex(load_file="pankegg/__init__.py", regex_pattern='__version__ = "([^"]+)"').group(1) %}

package:
  name: pankegg
  version: {{ version }}

source:
  path: ../

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - pankegg_make_db = pankegg.make_db:main
    - pankegg_app = pankegg.app:start_server

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >=3.9
    - flask >=2.2
    - jinja2 >=3.0
    - click >=8.0
    - python-dotenv >=0.21
    - pandas >=1.5
    - numpy >=1.23
    - scikit-learn >=1.1
    - scipy >=1.9

test:
  imports:
    - pankegg
    - pankegg.make_db
    - pankegg.app
  commands:
    - pankegg_make_db --version
    - pankegg_make_db --help
    - pankegg_app --help

about:
  home: https://github.com/RVanDamme/PANKEGG
  license: MIT
  license_file: LICENSE
  summary: "Build, explore and compare KEGG pathway, taxonomy and quality data of metagenome-assembled genomes"
