<!DOCTYPE html>
<html lang="en">
<head>
    <link href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="{{ url_for('static', filename='vendor/plotly.min.js') }}"></script>
    <title>{% block title %}{% endblock %}</title>
    {% block header %}{% endblock %}
    <style>
        .kegg-id {
            color: #007bff; /* Bootstrap primary blue */
            font-weight: bold;
            text-decoration: none; /* Optional: removes underline from links */
        }
        .highlighted-ko {
            color: #FF471F !important; /* Color for highlighted KO ID, important to override */
            font-weight: bold;
            text-decoration: none;
        }
        .light-blue-ko {
            color: #ADD8E6; /* Light blue color */
            font-weight: bold;
            text-decoration: none;
        }
        .highlighted-ko.light-blue-ko {
            color: #FF471F !important; /* Ensure orange color overrides light blue */
        }
        .legend-box {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-right: 10px;
            vertical-align: middle;
        }
        .legend-box.kegg-id {
            background-color: #007bff; /* Same color as kegg-id links */
        }
        .legend-box.light-blue-ko {
            background-color: #ADD8E6; /* Same color as light-blue-ko links */
        }
        .legend-box.highlighted-ko {
            background-color: #FF471F; /* Same color as highlighted-ko links */
        }
        .progress-circle {
            width: 80px;
            height: 80px;
            background: conic-gradient(#4caf50 0%, #d3d3d3 0%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #000;
            position: relative;
            margin: auto;  /* Center the circle in its column */
        }
        .progress-circle span {
            position: absolute;
            font-size: 0.9em;  /* Adjust font size if needed */
        }
        .progress-circle::before {
            content: '';
            width: 60%;
            height: 60%;
            background: #fff;
            border-radius: 50%;
            position: absolute;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">PANKEGG</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/">Overview</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/bin">Bin</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/map">Map</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/kegg">Kegg</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/taxonomy">Taxonomy</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/comparison">Visualisation</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/pathway_stat">Pathway Stats</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/module">Modules</a>
            </li>
          </ul>
        <form class="d-flex ms-auto" role="search" action="/search" method="get">
            <input class="form-control form-control-sm me-2" type="search" name="q" value="{{ request.args.get('q', '') if request.path == '/search' else '' }}"
                   placeholder="Search bins, samples, taxa, pathways, KOs" aria-label="Search" style="min-width: 300px;">
            <button class="btn btn-sm btn-outline-secondary" type="submit">Search</button>
        </form>
        </div>
      </div>
    </nav>
    {% block content %}
    {% endblock %}
    <script src="{{ url_for('static', filename='vendor/bootstrap.bundle.min.js') }}"></script>
    <script>
    function toggleAllCollapses() {
        var collapses = document.querySelectorAll('.collapse');
        var areAnyShown = Array.from(collapses).some(collapse => collapse.classList.contains('show'));

        collapses.forEach(collapse => {
            if (areAnyShown) {
                // If at least one is open, collapse all
                if (collapse.classList.contains('show')) {
                    new bootstrap.Collapse(collapse, { toggle: true });
                }
            } else {
                // if all are closed, open all
                if (!collapse.classList.contains('show')) {
                    new bootstrap.Collapse(collapse, { toggle: true });
                }
            }
        });
    }
    </script>

</body>
</html>
